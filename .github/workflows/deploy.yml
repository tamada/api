name: Generate and Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository owner and name notified from."
        required: true
      update_brew:
        description: "Need to update brew formula?"
        type: boolean
        required: true
        default: false

jobs:
  # homebrew-tap is itself one of the products of this API, so building before its
  # formula commit lands would publish stale information about it. Therefore this job
  # does not only dispatch the workflow, but also waits for it to complete.
  update-homebrew-tap:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.update_brew == 'true' }}
    steps:
      # Generate a one-time token using the private key
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            api
            homebrew-tap

      - name: Trigger Homebrew Tap Workflow and wait for it
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAP_REPO: tamada/homebrew-tap
          TAP_WORKFLOW: update-formula.yaml
          TARGET_REPO: ${{ github.event.inputs.repo }}
        run: |
          # gh workflow run only creates a dispatch event and does not report the run id,
          # so the dispatched run has to be found manually. Run ids increase monotonically,
          # hence the run whose id is greater than the latest one before the dispatch, and
          # whose run-name matches, is the one dispatched here. The run-name is defined in
          # update-formula.yaml of homebrew-tap.
          before=$(gh run list --repo "$TAP_REPO" --workflow "$TAP_WORKFLOW" \
                     --limit 1 --json databaseId --jq '.[0].databaseId // 0')

          gh workflow run "$TAP_WORKFLOW" --repo "$TAP_REPO" -f "repo=$TARGET_REPO"

          for _ in $(seq 30); do
            sleep 2
            id=$(gh run list --repo "$TAP_REPO" --workflow "$TAP_WORKFLOW" \
                   --limit 20 --json databaseId,displayTitle \
                 | jq -r --arg t "Update formula for $TARGET_REPO" \
                        --argjson before "$before" \
                        'map(select(.displayTitle == $t and .databaseId > $before))
                         | .[0].databaseId // empty')
            [ -n "$id" ] && break
          done

          if [ -z "$id" ]; then
            echo "::error::Could not identify the dispatched run ($TAP_REPO, repo=$TARGET_REPO)"
            exit 1
          fi

          echo "Waiting for https://github.com/$TAP_REPO/actions/runs/$id"
          gh run watch "$id" --repo "$TAP_REPO" --exit-status

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: update-homebrew-tap
    # update-homebrew-tap is skipped on push events and when update_brew is false,
    # therefore always() is required to run this job in those cases. Deploy even if the
    # formula update failed; the whole run is still marked as failure.
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set up Pkl
        run: |
          curl -L -o pkl https://github.com/apple/pkl/releases/download/0.25.2/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Setup Rust
        run: |
          rustup update stable

      - name: Build API
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # obtain the UID and GID of the container to avoid permission issues when creating files
          for i in assets/*.pkl ; do
              pkl eval -f json -o data/$(basename $i .pkl).json $i
          done
          cargo build --release
          cargo run -- --pretty --base-project-json data/base-products.json > data/products.json

          mkdir docs
          docker run --user $(id -u):$(id -g) -v $PWD:/opt quay.io/tama5/fauxrest:latest --dest docs data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-to-homepage:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      # Generate a one-time token using the private key
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            api
            tamada.github.io

      - name: Checkout
        uses: actions/checkout@v6

      # Fire the workflow for the other repository using the generated token
      - name: Trigger Homebrew Tap Workflow
        run: |
          gh workflow run "publish_site.yaml" \
             --repo "tamada/tamada.github.io" \
             --ref trunk
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
