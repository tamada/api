name: Generate and Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Pkl
        run: |
          curl -L -o pkl https://github.com/apple/pkl/releases/download/0.25.2/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Set up Just
        uses: taiki-e/install-action@just

      - name: Generate and Test Tamada API
        run: |
          git worktree add docs gh-pages
          for i in assets/* ; do
            pkl eval -f json -o data/$(basename $i .pkl).json $i
          done
          docker run --rm -v $PWD:/opt quay.io/tama5/fauxrest:latest data

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "
          cd docs
          git add .
          git commit -m "Update API data"
          git push origin gh-pages
