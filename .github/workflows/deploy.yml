name: Generate and Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Set up Pkl
        run: |
          curl -L -o pkl https://github.com/apple/pkl/releases/download/0.25.2/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Setup Rust
        run: |
          rustup update stable          

      - name: Build API
        run: |
          for i in assets/*.pkl ; do
              pkl eval -f json -o data/$(basename $i .pkl).json $i
          done
          cargo build --release
          cargo run -- --base-project-json data/base-products.json data/products.json

          mkdir docs
          docker run --rm -v $PWD:/opt quay.io/tama5/fauxrest:latest --dest docs data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5