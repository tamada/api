name: Generate and Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository owner and name notified from."
        required: true
      update_brew:
        description: "Need to update brew formula?"
        type: boolean
        required: true
        default: false
      full_refresh:
        description: "Fetch every product from GitHub, ignoring the published API as the cache?"
        type: boolean
        required: false
        default: false

jobs:
  # homebrew-tap is itself one of the products of this API, so building before its
  # formula commit lands would publish stale information about it. Therefore this job
  # does not only dispatch the workflow, but also waits for it to complete.
  update-homebrew-tap:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.update_brew == 'true' }}
    steps:
      # Generate a one-time token using the private key
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            api
            homebrew-tap

      - name: Trigger Homebrew Tap Workflow and wait for it
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAP_REPO: tamada/homebrew-tap
          TAP_WORKFLOW: update-formula.yaml
          TARGET_REPO: ${{ github.event.inputs.repo }}
        run: |
          # gh workflow run only creates a dispatch event and does not report the run id,
          # so the dispatched run has to be found manually. Run ids increase monotonically,
          # hence the run whose id is greater than the latest one before the dispatch, and
          # whose run-name matches, is the one dispatched here. The run-name is defined in
          # update-formula.yaml of homebrew-tap.
          before=$(gh run list --repo "$TAP_REPO" --workflow "$TAP_WORKFLOW" \
                     --limit 1 --json databaseId --jq '.[0].databaseId // 0')

          gh workflow run "$TAP_WORKFLOW" --repo "$TAP_REPO" -f "repo=$TARGET_REPO"

          for _ in $(seq 30); do
            sleep 2
            id=$(gh run list --repo "$TAP_REPO" --workflow "$TAP_WORKFLOW" \
                   --limit 20 --json databaseId,displayTitle \
                 | jq -r --arg t "Update formula for $TARGET_REPO" \
                        --argjson before "$before" \
                        'map(select(.displayTitle == $t and .databaseId > $before))
                         | .[0].databaseId // empty')
            [ -n "$id" ] && break
          done

          if [ -z "$id" ]; then
            echo "::error::Could not identify the dispatched run ($TAP_REPO, repo=$TARGET_REPO)"
            exit 1
          fi

          echo "Waiting for https://github.com/$TAP_REPO/actions/runs/$id"
          gh run watch "$id" --repo "$TAP_REPO" --exit-status

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: update-homebrew-tap
    # update-homebrew-tap is skipped on push events and when update_brew is false,
    # therefore always() is required to run this job in those cases. Deploy even if the
    # formula update failed; the whole run is still marked as failure.
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set up Pkl
        run: |
          curl -L -o pkl https://github.com/apple/pkl/releases/download/0.25.2/pkl-linux-amd64
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl
          pkl --version

      - name: Setup Rust
        run: |
          rustup update stable

      - name: Generate JSON from Pkl
        run: |
          for i in assets/*.pkl ; do
              pkl eval -f json -o data/$(basename $i .pkl).json $i
          done

      # The product list is maintained by hand on purpose: a product shows up in this API
      # only after its entry is committed to assets/base-products.pkl, so that every change
      # of the product set stays visible in the git history. Hence an unregistered
      # repository is never registered automatically here; it is only reported as a warning,
      # so that the notification is not swallowed silently. See .github/docs/ja/README.md.
      - name: Warn if the notified repository is not registered
        if: ${{ github.event.inputs.repo != '' }}
        env:
          TARGET_REPO: ${{ github.event.inputs.repo }}
        run: |
          owner=${TARGET_REPO%%/*}
          name=${TARGET_REPO##*/}
          if [ "$owner" = "$TARGET_REPO" ] || [ -z "$owner" ] || [ -z "$name" ]; then
            echo "::warning::The notified repository '$TARGET_REPO' is not in the <owner>/<name> form"
            exit 0
          fi

          if jq -e --arg owner "$owner" --arg name "$name" \
               'any(.[]; .owner == $owner and .name == $name)' \
               data/base-products.json > /dev/null ; then
            echo "$TARGET_REPO is registered in assets/base-products.pkl"
          else
            echo "::warning::$TARGET_REPO is not registered in assets/base-products.pkl, hence it does not show up in this API. See .github/docs/ja/README.md to register it."
          fi

      # The products of the previous build are read back from the published API, so
      # that only the repositories modified since are fetched from GitHub again. The
      # cache decides nothing: the product set and every configured value still come
      # from assets/base-products.pkl, and an unreachable or empty cache (the first
      # build, a deploy in flight, a 404) only costs a full fetch. It is written outside
      # data/, which is the input tree of fauxrest.
      - name: Fetch the published API as the cache
        if: ${{ github.event.inputs.full_refresh != 'true' }}
        env:
          CACHE_URL: https://tamada.github.io/api/products/index.json
        run: |
          curl -fsS "$CACHE_URL" -o "$RUNNER_TEMP/products-cache.json" || {
            echo "::warning::$CACHE_URL is unavailable, hence every product is fetched from GitHub"
            echo '[]' > "$RUNNER_TEMP/products-cache.json"
          }

      # product-merger only reads public repositories, by name, so the token of the run
      # is enough and no personal access token has to be kept in a secret. It does read
      # them: the first run on this token reported every timestamp and every detail,
      # once queries/products.graphql stopped asking for `collaborators`, which needs
      # push access to the repository and made the whole detail request fail with
      # "Resource not accessible by integration". Keep that query to the fields
      # `RepoDetail` reads, or this step starts falling back to the cached values.
      - name: Build API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: |
          cargo build --release
          if [ "$FULL_REFRESH" = "true" ]; then
            cache_opts="--no-cache"
          else
            cache_opts="--cache $RUNNER_TEMP/products-cache.json"
          fi
          cargo run --release -- --pretty --base-project-json $cache_opts data/base-products.json > data/products.json

          mkdir docs
          # obtain the UID and GID of the container to avoid permission issues when creating files
          docker run --user $(id -u):$(id -g) -v $PWD:/opt quay.io/tama5/fauxrest:latest --dest docs data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-to-homepage:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      # Generate a one-time token using the private key
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            api
            tamada.github.io

      - name: Checkout
        uses: actions/checkout@v6

      # Fire the workflow for the other repository using the generated token.
      # --ref is omitted on purpose, so that the dispatch always follows the default
      # branch of the target repository and survives a branch rename.
      - name: Trigger Homepage Workflow
        run: |
          gh workflow run "publish_site.yaml" \
             --repo "tamada/tamada.github.io"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
