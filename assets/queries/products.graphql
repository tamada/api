# Every field asked for here is one that `RepoDetail` (src/github.rs) reads.
#
# Nothing more is requested on purpose: `collaborators` needs push access to the
# repository, so asking for it made the whole request fail with "Resource not
# accessible by integration" under the token of the workflow run, even though every
# product is public and nothing in the output ever used the answer. Keep this query
# to the fields that are actually read, and it needs no access beyond reading a
# public repository.
query ($name: String!, $owner: String!) {
    repository(name: $name, owner: $owner) {
        name
        owner {
            login
        }
        description
        homepageUrl
        url
        createdAt
        updatedAt
        pushedAt
        isArchived
        licenseInfo {
            spdx: key
            name
            url
        }
        languages(first: 5) {
            nodes {
                name
            }
        }
        releases(first: 10, orderBy: {field: CREATED_AT, direction: DESC}) {
            nodes {
                name
                tagName
                description
                isDraft
                createdAt
                publishedAt
            }
        }
        repositoryTopics(first: 5) {
            nodes {
                topic {
                    name
                }
            }
        }
    }
}
